name: mealie-kunini

services:
  mealie:
    image: ${MEALIE_IMAGE:-ghcr.io/mealie-recipes/mealie:v3.30.0@sha256:90f83da6f3ab0a421efc827118a556168573930105f13fa3321768f42163d784}
    container_name: mealie
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:9001:9000"
    environment:
      ALLOW_PASSWORD_LOGIN: "false"
      ALLOW_SIGNUP: "false"
      API_DOCS: "false"
      BASE_URL: https://meal.kunini.ru
      DB_ENGINE: sqlite
      DEFAULT_GROUP: "Дом"
      DEFAULT_HOUSEHOLD: "Семья"
      LOG_LEVEL: info
      OIDC_AUTH_ENABLED: "true"
      OIDC_AUTO_REDIRECT: "true"
      OIDC_CLIENT_ID: mealie
      OIDC_CONFIGURATION_URL: https://auth.kunini.ru/oidc/.well-known/openid-configuration
      OIDC_GROUPS_CLAIM: roles
      OIDC_NAME_CLAIM: name
      OIDC_PROVIDER_NAME: Kunini
      OIDC_REMEMBER_ME: "true"
      OIDC_SIGNUP_ENABLED: "false"
      OIDC_USER_CLAIM: preferred_username
      PGID: "1000"
      PUID: "1000"
      TZ: Europe/Moscow
    volumes:
      - ${MEALIE_DATA_DIR:-../../data}:/app/data
    secrets:
      - OIDC_CLIENT_SECRET
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    stop_grace_period: 1m

secrets:
  OIDC_CLIENT_SECRET:
    file: ${MEALIE_SECRETS_DIR:-../../secrets}/oidc-client-secret
