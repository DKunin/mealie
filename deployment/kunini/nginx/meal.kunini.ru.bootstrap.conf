server {
    listen 80;
    listen [::]:80;
    server_name meal.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/mealie/deployment/kunini/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
