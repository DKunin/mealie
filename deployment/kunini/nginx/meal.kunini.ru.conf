map $cookie_i18n_redirected $mealie_initial_locale_cookie {
    default "";
    "" "i18n_redirected=ru-RU; Path=/; Max-Age=31536000; Secure; SameSite=Lax";
}

server {
    listen 80;
    listen [::]:80;
    server_name meal.kunini.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/apps/mealie/deployment/kunini/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meal.kunini.ru;

    ssl_certificate /home/dekunin/letsencrypt/live/meal.kunini.ru/fullchain.pem;
    ssl_certificate_key /home/dekunin/letsencrypt/live/meal.kunini.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Set-Cookie $mealie_initial_locale_cookie always;

    client_max_body_size 250m;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
